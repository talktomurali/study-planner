<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Govt exam study planner</title>
<style>
:root{--bg:#f7f6f2;--card:#ffffff;--soft:#efede6;--text:#1f1e1d;--muted:#5f5e5a;--faint:#888780;--border:rgba(0,0,0,.13);--accent:#185FA5;--accent-bg:#E6F1FB;--accent-border:#378ADD;--ok:#3B6D11;--danger:#A32D2D;--danger-bg:#FCEBEB}
@media (prefers-color-scheme:dark){:root{--bg:#1c1b1a;--card:#262524;--soft:#2e2d2b;--text:#eceae4;--muted:#b4b2a9;--faint:#888780;--border:rgba(255,255,255,.15);--accent:#B5D4F4;--accent-bg:#0C447C;--accent-border:#378ADD;--ok:#97C459;--danger:#F09595;--danger-bg:#501313}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.6}
.wrap{max-width:820px;margin:0 auto;padding:28px 18px 60px}
h1{font-size:24px;font-weight:600;margin:0 0 4px}
h3{font-size:17px;font-weight:600;margin:0 0 6px}
.sub{color:var(--muted);font-size:14px;margin:0 0 20px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.metric{background:var(--soft);border-radius:10px;padding:14px 16px}
.metric .l{font-size:13px;color:var(--muted)}
.metric .v{font-size:21px;font-weight:600}
.bar,.mini{background:var(--soft);border-radius:4px;overflow:hidden}
.bar{height:6px;margin:-6px 0 18px}
.mini{height:5px;margin:6px 0 10px}
.bar div,.mini div{height:100%;background:var(--accent-border);width:0}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
button{font:inherit;font-size:14px;color:var(--text);background:transparent;border:1px solid var(--border);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{background:var(--soft)}
button.on{background:var(--accent-bg);color:var(--accent);border-color:var(--accent-border)}
input[type=date],input[type=number],input[type=text],select,textarea{font:inherit;font-size:14px;color:var(--text);background:var(--card);border:1px solid var(--border);border-radius:8px;padding:5px 8px}
textarea{width:100%;min-height:60px;resize:vertical}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 18px;margin-bottom:12px}
.card.today{border:2px solid var(--accent-border)}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px;flex-wrap:wrap}
.head b{font-size:15px}
.row{display:flex;gap:10px;align-items:flex-start;padding:5px 0;font-size:14px;cursor:pointer}
.row input{margin-top:4px;flex-shrink:0;width:16px;height:16px}
.done{color:var(--faint);text-decoration:line-through}
.muted{font-size:13px;color:var(--muted)}
details{border-top:1px solid var(--border);padding:8px 0}
summary{cursor:pointer;font-size:15px}
.ctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.fld label{display:block;font-size:13px;color:var(--muted);margin-bottom:2px}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:6px;background:var(--soft);margin:2px 4px 2px 0}
.chip.weak{background:var(--danger-bg);color:var(--danger)}
.err{color:var(--danger);font-size:13px}
.foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:24px;padding-top:16px;border-top:1px solid var(--border)}
.okmsg{color:var(--ok);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
<h1>Govt exam study planner</h1>
<p class="sub">SSC CGL · RRB NTPC · Bank exams — quant, reasoning, English, GA, current affairs and computer knowledge</p>
<div class="metrics">
<div class="metric"><div class="l">Plan tasks done</div><div class="v" id="m-tasks">0 / 168</div></div>
<div class="metric"><div class="l">Days fully complete</div><div class="v" id="m-days">0 / 56</div></div>
<div class="metric"><div class="l">Subtopics done</div><div class="v" id="m-topics">0</div></div>
<div class="metric"><div class="l">Today</div><div class="v" id="m-week">–</div></div>
</div>
<div class="bar"><div id="m-bar"></div></div>
<div class="tabs" id="views">
<button data-v="plan" class="on">Daily plan</button>
<button data-v="topics">Topics checklist</button>
<button data-v="mocks">Mock tracker</button>
<button data-v="resources">Resources</button>
<button data-v="rules">Rules</button>
</div>
<div id="view"></div>
<div class="foot">
<button id="exp">Back up progress</button>
<button id="imp">Restore backup</button>
<button id="rst">Reset plan and topic ticks</button>
<input type="file" id="impfile" accept=".json,application/json" style="display:none">
<span id="msg" class="okmsg"></span>
</div>
<p class="muted" id="store"></p>
</div>
<script>
const K='govtExamPlanner.v1';
const W=[
{q:'Speed basics: tables, squares, cubes, fraction to percentage',r:'Analogy and classification',e:'Parts of speech: nouns, pronouns, adjectives',g:'Ancient history (NCERT Class 6)',s:'Physics: motion, force, laws of motion'},
{q:'Number system, simplification, HCF and LCM',r:'Number and letter series',e:'Verbs and the 12 tenses',g:'Medieval history (NCERT Class 7)',s:'Chemistry: matter, atoms, molecules'},
{q:'Percentage',r:'Coding-decoding',e:'Subject-verb agreement and articles',g:'Modern history (NCERT Class 8 and 10)',s:'Biology: cell and tissues'},
{q:'Ratio, proportion, partnership, mixtures',r:'Blood relations and directions',e:'Prepositions and conjunctions',g:'Polity: Constitution, Preamble, rights, duties',s:'Physics: light and sound'},
{q:'Averages, ages, profit, loss, discount',r:'Order-ranking and Venn diagrams',e:'Error spotting and sentence improvement',g:'Polity: Parliament, President, judiciary, local government',s:'Chemistry: acids, bases, salts, metals'},
{q:'Simple and compound interest',r:'Syllogism and mathematical operations',e:'Active and passive voice',g:'Physical geography (NCERT Class 6 and 7)',s:'Biology: human body systems'},
{q:'Time and work, pipes and cisterns',r:'Mirror images, paper folding, embedded figures',e:'Direct and indirect speech',g:'Indian geography (NCERT Class 9 and 10)',s:'Physics: electricity and magnetism'},
{q:'Time, speed, distance, trains, boats',r:'Counting figures and mixed revision',e:'Idioms, one-word substitution, reading comprehension',g:'Economy basics (NCERT Class 9 and 10)',s:'Biology: nutrition, diseases, heredity'}];
function tasks(w,d){const x=W[w];const paper=w%2===0?'Full previous-year paper: SSC CGL Tier 1 (60 min, timed) – log it in the mock tracker':'Full previous-year paper: RRB NTPC CBT 1 (90 min, timed) – log it in the mock tracker';return [
['GA (1 hr): '+x.g,'Quant (1 hr): '+x.q+' – learn the concept, solve 20 basic questions','Reasoning (1 hr): '+x.r+' – learn the method, solve 20 questions'],
['Current affairs (30 min) + revise yesterday (30 min)','Quant (1 hr): '+x.q+' – practice set','English (1 hr): '+x.e+' – rules + 10 new words'],
['GA (1 hr): '+x.g+' – continue, write one-page notes','Quant (1 hr): '+x.q+' – previous-year questions','Reasoning (1 hr): '+x.r+' – previous-year questions'],
['Current affairs (30 min) + revise this week\'s notes (30 min)','Quant (1 hr): '+x.q+' – timed set','English (1 hr): '+x.e+' – practice questions + 10 new words'],
['Science (1 hr): '+x.s+' (NCERT Science)','Reasoning (1 hr): '+x.r+' – timed set','English (1 hr): read one editorial + vocabulary review'],
['Quant (3 hrs): finish '+x.q+' + mixed previous-year questions','Reasoning (2 hrs): mixed practice of all topics so far','Static GA (2 hrs): finish '+x.g+' + notes'],
[paper,'Analyse the paper and update your mistakes notebook (1–1.5 hrs)','Revise all of this week\'s notes and formula sheets (2 hrs)']][d];}

const SUB=[
{n:'Quantitative aptitude',a:'Learn the concept, solve 20 basic questions, then previous-year questions on the same day. Keep one formula page per topic. Revise tables and squares daily in the first month.',t:[
['Speed basics',['Tables 1–20','Squares 1–30','Cubes 1–15','Fraction to percentage','Divisibility rules']],
['Number system',['Types of numbers','Divisibility','Remainders','Unit digit','Factors']],
['Simplification',['BODMAS','Surds and indices','Approximation (bank)']],
['HCF and LCM',['Prime factorisation','Division method','Word problems']],
['Percentage',['Basics','Increase and decrease','Successive change','Population and depreciation']],
['Ratio and proportion',['Ratio basics','Partnership','Mixtures and alligation']],
['Averages and ages',['Average basics','Replacement problems','Age problems']],
['Profit, loss and discount',['Cost, selling and marked price','Successive discounts','Dishonest dealer']],
['Simple and compound interest',['Simple interest','Compound interest','Difference between SI and CI','Instalments']],
['Time and work',['Efficiency method','Pipes and cisterns','Work and wages']],
['Time, speed and distance',['Relative speed','Trains','Boats and streams','Races']],
['Mensuration',['2D areas and perimeters','3D volume and surface area']],
['Algebra (CGL)',['Identities','a + 1/a type questions','Linear equations']],
['Geometry (CGL)',['Lines and angles','Triangles','Circles','Quadrilaterals']],
['Trigonometry (CGL)',['Ratios','Identities','Heights and distances']],
['Data interpretation',['Tables','Bar graphs','Line graphs','Pie charts','Caselets']],
['Bank-only topics',['Number series (missing term)','Number series (wrong term)','Quadratic equations','Approximation']]]},
{n:'Reasoning',a:'Learn the method for each question type, then build volume. Never skip reasoning for more than two days. From week 9, do 2–3 bank puzzles every day.',t:[
['Analogy and classification',['Number','Letter','Word','Meaning-based']],
['Series',['Number series','Alphabet series','Alphanumeric series','Missing term']],
['Coding-decoding',['Letter shift','Number coding','Substitution','New pattern']],
['Blood relations',['Direct','Coded','Family tree']],
['Directions and distance',['Turns','Shadow questions','Final position']],
['Order and ranking',['Position from both ends','Comparisons']],
['Venn diagrams and syllogism',['Venn representation','Syllogism','Possibility cases']],
['Mathematical operations',['Symbol substitution','Interchange of signs']],
['Statement-based',['Conclusions','Assumptions','Arguments','Course of action']],
['Non-verbal',['Mirror and water images','Paper folding and cutting','Embedded figures','Counting figures','Dice and cubes']],
['Bank-only topics',['Inequalities','Floor puzzles','Box puzzles','Scheduling puzzles','Linear seating','Circular seating','Input-output','Data sufficiency']]]},
{n:'English',a:'Grammar rules first, then question types. Vocabulary every day. Read one editorial daily for comprehension speed.',t:[
['Grammar basics',['Nouns','Pronouns','Adjectives','Adverbs']],
['Verbs and tenses',['12 tenses','Modals','Subject-verb agreement']],
['Articles, prepositions, conjunctions',['Articles','Prepositions','Conjunctions']],
['Voice and narration',['Active and passive voice','Direct and indirect speech']],
['Error spotting and sentence improvement',['Error spotting','Sentence improvement']],
['Vocabulary',['Synonyms','Antonyms','Idioms and phrases','One-word substitution','Spelling']],
['Comprehension',['Reading comprehension','Cloze test','Para jumbles','Fill in the blanks']],
['Bank-only topics',['Word swap','Sentence connectors','Column-based questions']]]},
{n:'Static GA',a:'NCERT first, one subject at a time. One-page note per chapter. Use previous-year questions to see which facts get asked.',t:[
['History',['Ancient: Indus and Vedic','Ancient: Maurya and Gupta','Medieval: Delhi Sultanate','Medieval: Mughals','Bhakti and Sufi movements','Modern: 1857 revolt','Modern: Indian National Congress','Modern: Gandhian era and independence']],
['Polity',['Constitution making','Preamble','Fundamental rights','DPSP and duties','Parliament','President and PM','Judiciary','Local government','Important amendments']],
['Geography',['Earth and universe','Landforms','Climate','Indian rivers','Soils and crops','Minerals','National parks']],
['Economy',['Basic terms','GDP and inflation','Budget','Banking and RBI','Planning and NITI Aayog']],
['Science',['Physics: motion','Physics: light and sound','Physics: electricity','Chemistry: matter','Chemistry: acids and bases','Chemistry: metals','Biology: cell','Biology: human body','Biology: nutrition and diseases']],
['Static GK',['Dances','Festivals','Monuments','Awards','Books and authors','Sports','Important days','Organisations and headquarters']]]},
{n:'Current affairs',a:'30 minutes daily from one source, plus a monthly compilation. Cover the last 6–12 months before your exam.',t:[
['National and international',['Major events','Summits','Agreements']],
['Economy and banking',['RBI policy and rates','Budget','Banking terms','Government schemes']],
['People and awards',['Appointments','Awards','Obituaries']],
['Sports',['Tournaments','Winners','Venues']],
['Science, tech and defence',['Missions and launches','Defence exercises']],
['Reports and days',['Indices and rankings','Important days and themes']]]},
{n:'Computer knowledge',a:'Needed for SSC CGL Tier 2 and bank mains. Easy for you as a software engineer – revise the exam-style terms and shortcuts.',t:[
['Basics',['Hardware and software','Input and output devices','Memory and storage','Number systems (binary, hex)']],
['MS Office',['Word','Excel','PowerPoint','Keyboard shortcuts']],
['Internet and networking',['Networking basics','Internet terms','Email']],
['Security',['Viruses and malware','Cyber security terms']]]}];

const RULES=['Use one book per subject, one mock test series, and one current affairs source. Collecting more is the most common way to waste time.','Solve questions on the same day you learn a topic. Watching videos without solving gives a false feeling of progress.','Keep a mistakes notebook. Write every wrong question with the correct method and reread it every Sunday.','Revise each topic three times: the next day, after one week, and after one month.','Spend as long analysing a mock or previous-year paper as you spent taking it. Log every test in the mock tracker.','Protect your weekday slots. One hour every day beats one long session a week.','Quant gets the most time because it takes the longest to build.','From month 3, practise bank sections under real 20-minute section timers.','Accuracy beats attempts – every exam has negative marking. Skip questions you are unsure of.','Check ssc.gov.in, ibps.in, your RRB site and Employment News weekly. Application windows are short.'];

function yt(q){return 'https://www.youtube.com/results?search_query='+encodeURIComponent(q);}
const RES=[
{n:'Free official ebooks and websites',note:'Legal and free. Start here before buying anything.',i:[
['NCERT textbooks','Base for static GA and general science (already downloaded)','https://ncert.nic.in/textbook.php'],
['NIOS study material','Free official PDFs: History, Geography, Economics, Science, Maths. Learners\' Corner → Study Material','https://www.nios.ac.in'],
['DIKSHA','Free government videos explaining NCERT chapters','https://diksha.gov.in'],
['PIB','Official government news releases – the most reliable current affairs source','https://pib.gov.in'],
['RBI','Repo rate, monetary policy, banking terms – for bank exams','https://www.rbi.org.in'],
['Union Budget and Economic Survey','Budget highlights and Economic Survey summary','https://www.indiabudget.gov.in'],
['Employment News','Weekly government jobs paper listing all central recruitments','https://employmentnews.gov.in'],
['SSC official site','CGL and JE notifications, One-Time Registration, answer keys','https://ssc.gov.in'],
['IBPS official site','Bank PO and Clerk notifications and calendar','https://www.ibps.in'],
['Indian Railways','Links to all regional RRB websites','https://indianrailways.gov.in']]},
{n:'Books to buy (one per subject)',note:'Buy original copies. Pirated PDFs are illegal, often outdated, and can carry malware.',i:[
['Lucent\'s General Knowledge','Static GA – the standard book',''],
['R.S. Aggarwal Quantitative Aptitude or Rakesh Yadav 7300+','Quant – pick one only',''],
['R.S. Aggarwal Verbal and Non-Verbal Reasoning','Reasoning practice',''],
['Neetu Singh – English for General Competition (Plinth to Paramount)','English grammar and practice',''],
['Word Power Made Easy – Norman Lewis','Vocabulary building',''],
['Kiran Publication solved papers','Previous-year papers for SSC and Railways','']]},
{n:'YouTube: SSC CGL and RRB NTPC',note:'Pick one teacher per subject and finish the playlist before trying another.',i:[
['Adda247 SSC CGL','Structured batches covering all four subjects',yt('Adda247 SSC CGL')],
['SSC Wallah','Batch-style classes for all subjects',yt('SSC Wallah')],
['SSC Testbook','Practice sessions and mock discussions',yt('SSC Testbook')],
['English by Neetu Mam','Grammar rules and vocabulary',yt('English by Neetu Mam')],
['English With Rani Mam','Error spotting and sentence improvement',yt('English With Rani Mam')],
['Reasoning By Piyush Varshney','Topic-wise reasoning for SSC and banks',yt('Reasoning By Piyush Varshney')],
['Gagan Pratap Maths','SSC arithmetic and advanced maths',yt('Gagan Pratap Maths SSC')],
['Aditya Ranjan Maths','SSC maths practice and advanced maths',yt('Aditya Ranjan Maths SSC')]]},
{n:'YouTube: bank exams (start from week 9)',note:'Bank exams need speed, puzzles and data interpretation.',i:[
['Banking Wallah','Complete bank exam foundation',yt('Banking Wallah')],
['BankersAdda','Quant, reasoning and English for bank exams',yt('BankersAdda')],
['Guidely','Bank-level puzzles and prelims practice sets',yt('Guidely bank exams')],
['Oliveboard','Bank, insurance and regulatory exam prep',yt('Oliveboard bank exams')],
['Banking Chronicle – Ankush Lamba','Puzzles and seating arrangement',yt('Banking Chronicle Ankush Lamba puzzles')]]},
{n:'Current affairs',note:'20–30 minutes daily from one source, plus one monthly compilation for revision.',i:[
['GKToday','Daily current affairs and monthly PDFs – pick this or AffairsCloud','https://www.gktoday.in'],
['AffairsCloud','Daily current affairs and quizzes – pick this or GKToday','https://affairscloud.com'],
['The Hindu','One editorial daily for English comprehension','https://www.thehindu.com'],
['The Indian Express','Alternative for daily editorial reading','https://indianexpress.com']]},
{n:'Mock tests',note:'Free tests in months 1–4. From month 5, buy one paid series covering SSC, Railways and Banks.',i:[
['Testbook','Free and paid mocks for SSC, Railways and Banks','https://testbook.com'],
['Oliveboard','Strong for bank mocks; also SSC and Railways','https://www.oliveboard.in'],
['Adda247','Free and paid mocks with previous-year papers','https://www.adda247.com']]}];

const SK=['q','r','e','g'];
const SN={q:'Quant',r:'Reasoning',e:'English',g:'GA'};
const TYPES=['SSC CGL Tier 1 full mock','RRB NTPC CBT 1 full mock','Bank prelims full mock','Previous-year paper','Sectional test','Topic test'];
const MP={'SSC CGL Tier 1 full mock':{q:50,r:50,e:50,g:50},'RRB NTPC CBT 1 full mock':{q:30,r:30,e:'',g:40},'Bank prelims full mock':{q:35,r:35,e:30,g:''}};

let S={start:'',done:{},topics:{},mocks:[]},persist=false,view='plan',cw=0,mf='All';
try{const raw=localStorage.getItem(K);if(raw){const p=JSON.parse(raw);S.start=p.start||'';S.done=p.done||{};S.topics=p.topics||{};S.mocks=Array.isArray(p.mocks)?p.mocks:[];}localStorage.setItem(K+'.t','1');persist=true;}catch(e){}
function save(){if(persist){try{localStorage.setItem(K,JSON.stringify(S));}catch(e){flash('Could not save – storage may be full.');}}}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parse(s){const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function monday(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
function today0(){const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate());}
if(!S.start){const t=today0();t.setDate(t.getDate()+(8-t.getDay())%7);S.start=iso(t);save();}
function todayIdx(){return Math.round((today0()-parse(S.start))/864e5);}
function fmt(i){const d=parse(S.start);d.setDate(d.getDate()+i);return d.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});}
function fmtD(s){return parse(s).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function rn(n){return Math.round(n*100)/100;}
function flash(t){const m=document.getElementById('msg');m.textContent=t;clearTimeout(flash.h);flash.h=setTimeout(()=>m.textContent='',3500);}
const $=id=>document.getElementById(id);

function topicCounts(si,ti){const u=SUB[si].t[ti][1];let c=0;u.forEach((_,k)=>{if(S.topics['s'+si+'t'+ti+'u'+k])c++;});return [c,u.length];}
function subjCounts(si){let c=0,n=0;SUB[si].t.forEach((_,ti)=>{const r=topicCounts(si,ti);c+=r[0];n+=r[1];});return [c,n];}
function allTopicCounts(){let c=0,n=0;SUB.forEach((_,si)=>{const r=subjCounts(si);c+=r[0];n+=r[1];});return [c,n];}

function metrics(){let n=0,days=0;for(let w=0;w<8;w++)for(let d=0;d<7;d++){let c=0;for(let t=0;t<3;t++)if(S.done['w'+w+'d'+d+'t'+t])c++;n+=c;if(c===3)days++;}
$('m-tasks').textContent=n+' / 168';$('m-days').textContent=days+' / 56';$('m-bar').style.width=Math.round(n/168*100)+'%';
const tc=allTopicCounts();$('m-topics').textContent=tc[0]+' / '+tc[1];
const ti=todayIdx();$('m-week').textContent=ti<0?'Starts '+fmt(0):ti>55?'Plan complete':'Week '+(Math.floor(ti/7)+1)+', day '+(ti+1);}

function rPlan(){const ti=todayIdx();
let h='<div class="ctl"><label class="muted" for="st">Start date (a Monday)</label><input type="date" id="st" value="'+S.start+'"><button id="tdy">Go to today</button></div>';
h+='<div class="tabs">';for(let i=0;i<8;i++)h+='<button data-w="'+i+'" class="'+(i===cw?'on':'')+'">Week '+(i+1)+'</button>';h+='</div>';
const x=W[cw];h+='<p class="muted" style="margin:0 0 12px">This week: '+x.q+' · '+x.r+' · '+x.e+' · '+x.g+'</p>';
for(let d=0;d<7;d++){const idx=cw*7+d,ts=tasks(cw,d);let c=0,rows='';
ts.forEach((t,k)=>{const id='w'+cw+'d'+d+'t'+k,on=!!S.done[id];if(on)c++;rows+='<label class="row"><input type="checkbox" data-t="'+id+'"'+(on?' checked':'')+'><span class="'+(on?'done':'')+'">'+esc(t)+'</span></label>';});
const isT=idx===ti;h+='<div class="card'+(isT?' today':'')+'"'+(isT?' id="todaycard"':'')+'><div class="head"><b>Day '+(idx+1)+' · '+fmt(idx)+(isT?' · today':'')+'</b><span class="muted">'+c+'/3</span></div>'+rows+'</div>';}
return h;}

function rTopics(){return '<p class="muted" style="margin:0 0 12px">Tick each subtopic when you have learned it and solved its previous-year questions. A topic is struck off when all its subtopics are done.</p>'+SUB.map((s,si)=>{const sc=subjCounts(si);
return '<div class="card"><div class="head"><h3 style="margin:0">'+s.n+'</h3><span class="muted" id="sc-'+si+'">'+sc[0]+' / '+sc[1]+' subtopics done</span></div><div class="mini"><div id="sb-'+si+'" style="width:'+Math.round(sc[0]/sc[1]*100)+'%"></div></div><p class="muted" style="margin:0 0 6px">'+s.a+'</p>'+
s.t.map((t,ti)=>{const tc=topicCounts(si,ti);
return '<details><summary><span id="tn-'+si+'-'+ti+'" class="'+(tc[0]===tc[1]?'done':'')+'">'+esc(t[0])+'</span> <span class="muted" id="tc-'+si+'-'+ti+'">'+tc[0]+'/'+tc[1]+'</span></summary><div style="padding:4px 0 4px 6px">'+
t[1].map((u,k)=>{const id='s'+si+'t'+ti+'u'+k,on=!!S.topics[id];return '<label class="row"><input type="checkbox" data-u="'+id+'" data-si="'+si+'" data-ti="'+ti+'"'+(on?' checked':'')+'><span class="'+(on?'done':'')+'">'+esc(u)+'</span></label>';}).join('')+
'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px"><button data-all="'+si+'-'+ti+'">Mark all done</button><button data-clr="'+si+'-'+ti+'">Clear</button><button data-ask="'+esc(t[0])+'" data-sub="'+esc(s.n)+'">Copy "teach me" prompt</button></div></div></details>';}).join('')+'</div>';}).join('');}

function syncTopic(si,ti){const tc=topicCounts(si,ti);
const c=$('tc-'+si+'-'+ti);if(c)c.textContent=tc[0]+'/'+tc[1];
const nm=$('tn-'+si+'-'+ti);if(nm)nm.className=tc[0]===tc[1]?'done':'';
SUB[si].t[ti][1].forEach((_,k)=>{const id='s'+si+'t'+ti+'u'+k,cb=document.querySelector('[data-u="'+id+'"]');if(cb){cb.checked=!!S.topics[id];cb.nextElementSibling.className=S.topics[id]?'done':'';}});
const sc=subjCounts(si);const se=$('sc-'+si);if(se)se.textContent=sc[0]+' / '+sc[1]+' subtopics done';const sb=$('sb-'+si);if(sb)sb.style.width=Math.round(sc[0]/sc[1]*100)+'%';metrics();}

function pct(m){let s=0,x=0;SK.forEach(k=>{if(m.sc[k]){s+=m.sc[k].s;x+=m.sc[k].m;}});return x?s/x*100:0;}
function totals(m){let s=0,x=0;SK.forEach(k=>{if(m.sc[k]){s+=m.sc[k].s;x+=m.sc[k].m;}});return [rn(s),rn(x)];}
function fld(l,inner){return '<div class="fld"><label>'+l+'</label>'+inner+'</div>';}

function rMocks(){return '<div class="card"><h3>Log a test</h3><div class="grid4">'+
fld('Date','<input type="date" id="mf-date" value="'+iso(today0())+'" style="width:100%">')+
fld('Test type','<select id="mf-type" style="width:100%">'+TYPES.map(t=>'<option>'+t+'</option>').join('')+'</select>')+
fld('Test name or source','<input type="text" id="mf-name" placeholder="Testbook mock 3" style="width:100%">')+
'</div><p class="muted" style="margin:10px 0 4px">Enter net scores after negative marking. Leave both boxes blank for a section the test did not have. Max marks fill in automatically for full mocks – change them if your test differs (IBPS PO prelims: quant 30, reasoning 40).</p><div class="grid4">'+
SK.map(k=>fld(SN[k],'<div style="display:flex;gap:6px;align-items:center"><input type="number" step="0.25" id="mf-'+k+'s" placeholder="score" style="width:50%"><span class="muted">/</span><input type="number" step="1" min="1" id="mf-'+k+'m" placeholder="max" style="width:50%"></div>')).join('')+
'</div><div class="grid4" style="margin-top:10px">'+
fld('Questions attempted (optional)','<input type="number" min="0" id="mf-att" style="width:100%">')+
fld('Questions wrong (optional)','<input type="number" min="0" id="mf-wr" style="width:100%">')+
fld('Time taken, minutes (optional)','<input type="number" min="0" id="mf-time" style="width:100%">')+
'</div><div class="fld" style="margin-top:10px"><label for="mf-notes">Weak topics and lessons from this test</label><textarea id="mf-notes" placeholder="Ran out of time in geometry; 3 careless errors in percentage"></textarea></div>'+
'<div style="display:flex;gap:12px;align-items:center;margin-top:10px;flex-wrap:wrap"><button id="mf-add" class="on">Save test</button><span id="mf-err" class="err"></span></div></div>'+
'<div class="ctl"><label class="muted" for="mf-filter">Show</label><select id="mf-filter">'+['All'].concat(TYPES).map(t=>'<option'+(t===mf?' selected':'')+'>'+t+'</option>').join('')+'</select></div><div id="mk-list">'+mockList()+'</div>';}

function setPreset(){const p=MP[$('mf-type').value]||{};SK.forEach(k=>{$('mf-'+k+'m').value=p[k]||'';});}

function chart(L,P){if(L.length<2)return '<div class="card"><p class="muted" style="margin:0">Log two or more tests to see your trend line.</p></div>';
const n=L.length,x0=44,x1=588,y0=168,y1=12,X=i=>x0+(x1-x0)*i/(n-1),Y=v=>y0-(y0-y1)*Math.max(0,Math.min(100,v))/100;
let s='<svg viewBox="0 0 600 200" width="100%" role="img" aria-label="Score trend in percent"><title>Score trend</title>';
[0,25,50,75,100].forEach(v=>{s+='<line x1="'+x0+'" x2="'+x1+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="currentColor" stroke-opacity="0.12"/><text x="'+(x0-6)+'" y="'+(Y(v)+4)+'" text-anchor="end" font-size="11" fill="currentColor" fill-opacity="0.6">'+v+'%</text>';});
s+='<polyline fill="none" stroke="#378ADD" stroke-width="2" points="'+P.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ')+'"/>';
P.forEach((v,i)=>{s+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="3.5" fill="#378ADD"><title>'+fmtD(L[i].date)+': '+v.toFixed(1)+'%</title></circle>';});
s+='<text x="'+x0+'" y="192" font-size="11" fill="currentColor" fill-opacity="0.6">'+fmtD(L[0].date)+'</text><text x="'+x1+'" y="192" text-anchor="end" font-size="11" fill="currentColor" fill-opacity="0.6">'+fmtD(L[n-1].date)+'</text></svg>';
return '<div class="card"><div class="muted" style="margin-bottom:4px">Total score trend (%)</div>'+s+'</div>';}

function mockList(){const L=S.mocks.filter(m=>mf==='All'||m.type===mf).slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.id-b.id);
if(!L.length)return '<p class="muted">No tests logged yet'+(mf==='All'?'':' for this type')+'. Save your first test above.</p>';
const P=L.map(pct),avg=P.reduce((a,b)=>a+b,0)/P.length,best=Math.max(...P);
const last=P.slice(-5),prev=P.slice(-10,-5),la=last.reduce((a,b)=>a+b,0)/last.length;
let delta='';if(prev.length){const pa=prev.reduce((a,b)=>a+b,0)/prev.length,d=la-pa;delta=' <span class="muted">('+(d>=0?'+':'')+d.toFixed(1)+' vs previous 5)</span>';}
let h='<div class="metrics"><div class="metric"><div class="l">Tests logged</div><div class="v">'+L.length+'</div></div><div class="metric"><div class="l">Average</div><div class="v">'+avg.toFixed(1)+'%</div></div><div class="metric"><div class="l">Best</div><div class="v">'+best.toFixed(1)+'%</div></div><div class="metric"><div class="l">Last 5 average</div><div class="v">'+la.toFixed(1)+'%'+delta+'</div></div></div>';
h+=chart(L,P);
const sa={};SK.forEach(k=>{const v=L.filter(m=>m.sc[k]).map(m=>m.sc[k].s/m.sc[k].m*100);if(v.length)sa[k]=v.reduce((a,b)=>a+b,0)/v.length;});
const ks=Object.keys(sa);if(ks.length){const weak=ks.reduce((a,b)=>sa[a]<=sa[b]?a:b);
h+='<div class="card"><div class="muted" style="margin-bottom:4px">Section averages'+(ks.length>1?' – focus on the red one':'')+'</div>'+ks.map(k=>'<span class="chip'+(ks.length>1&&k===weak?' weak':'')+'">'+SN[k]+': '+sa[k].toFixed(1)+'%</span>').join('')+'</div>';}
h+=L.slice().reverse().map(m=>{const t=totals(m),p=pct(m);
let acc='';if(m.att&&m.wr!=null&&m.wr!==''){acc='Accuracy '+((m.att-m.wr)/m.att*100).toFixed(1)+'% ('+m.wr+' wrong of '+m.att+')';}
const extra=[acc,m.time?m.time+' min':''].filter(Boolean).join(' · ');
return '<div class="card"><div class="head"><b>'+fmtD(m.date)+' · '+esc(m.type)+'</b><span><b>'+t[0]+' / '+t[1]+'</b> <span class="muted">('+p.toFixed(1)+'%)</span></span></div>'+
(m.name?'<div class="muted">'+esc(m.name)+'</div>':'')+
'<div style="margin:6px 0">'+SK.filter(k=>m.sc[k]).map(k=>'<span class="chip">'+SN[k]+' '+rn(m.sc[k].s)+'/'+m.sc[k].m+'</span>').join('')+'</div>'+
(extra?'<div class="muted">'+extra+'</div>':'')+
(m.notes?'<div style="font-size:14px;margin-top:6px;white-space:pre-wrap">'+esc(m.notes)+'</div>':'')+
'<div style="margin-top:8px"><button data-del="'+m.id+'">Delete</button></div></div>';}).join('');
return h;}

function saveMock(){const err=t=>{$('mf-err').textContent=t;};
const date=$('mf-date').value;if(!date)return err('Pick the test date.');
const sc={};let any=false;
for(const k of SK){const sv=$('mf-'+k+'s').value.trim(),mv=$('mf-'+k+'m').value.trim();
if(sv===''&&mv==='')continue;
if(sv===''||mv==='')return err('Enter both score and max for '+SN[k]+', or leave both blank.');
const s=+sv,m=+mv;if(!(m>0))return err('Max marks for '+SN[k]+' must be above 0.');
if(isNaN(s)||s>m||s<-m)return err(SN[k]+' score must be between -'+m+' and '+m+'.');
sc[k]={s:s,m:m};any=true;}
if(!any)return err('Enter at least one section score.');
const att=$('mf-att').value===''?null:+$('mf-att').value,wr=$('mf-wr').value===''?null:+$('mf-wr').value,tm=$('mf-time').value===''?null:+$('mf-time').value;
if(att!=null&&wr!=null&&wr>att)return err('Wrong answers cannot be more than questions attempted.');
S.mocks.push({id:Date.now(),date:date,type:$('mf-type').value,name:$('mf-name').value.trim(),sc:sc,att:att,wr:wr,time:tm,notes:$('mf-notes').value.trim()});
save();render();flash('Test saved.');}

function rRes(){return RES.map(g=>'<div class="card"><h3>'+g.n+'</h3>'+(g.note?'<p class="muted" style="margin:0 0 8px">'+g.note+'</p>':'')+g.i.map(x=>'<div style="padding:8px 0;border-top:1px solid var(--border)">'+(x[2]?'<a href="'+x[2]+'" target="_blank" rel="noopener" style="color:var(--accent);font-weight:600;text-decoration:none">'+esc(x[0])+' ↗</a>':'<b>'+esc(x[0])+'</b>')+'<div class="muted">'+esc(x[1])+'</div></div>').join('')+'</div>').join('');}
function rRules(){return '<div class="card">'+RULES.map((r,i)=>'<div class="row" style="cursor:default"><b style="min-width:22px">'+(i+1)+'.</b><span>'+esc(r)+'</span></div>').join('')+'</div>';}

function render(){const R={plan:rPlan,topics:rTopics,mocks:rMocks,resources:rRes,rules:rRules};$('view').innerHTML=R[view]();if(view==='mocks')setPreset();metrics();}

function copyText(t){if(navigator.clipboard&&window.isSecureContext){return navigator.clipboard.writeText(t);}
return new Promise((res,rej)=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')?res():rej();}catch(e){rej(e);}a.remove();});}

document.querySelectorAll('#views [data-v]').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.v;document.querySelectorAll('#views [data-v]').forEach(o=>o.classList.toggle('on',o===b));render();}));
const V=$('view');
V.addEventListener('change',e=>{const t=e.target;
if(t.dataset.t){if(t.checked)S.done[t.dataset.t]=true;else delete S.done[t.dataset.t];save();render();}
else if(t.dataset.u){if(t.checked)S.topics[t.dataset.u]=true;else delete S.topics[t.dataset.u];save();syncTopic(+t.dataset.si,+t.dataset.ti);}
else if(t.id==='st'&&t.value){S.start=iso(monday(parse(t.value)));save();render();}
else if(t.id==='mf-type'){setPreset();}
else if(t.id==='mf-filter'){mf=t.value;$('mk-list').innerHTML=mockList();}});
V.addEventListener('input',e=>{if(e.target.id&&e.target.id.indexOf('mf-')===0){const er=$('mf-err');if(er)er.textContent='';}});
V.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.w!==undefined){cw=+b.dataset.w;render();}
else if(b.id==='tdy'){const ti=todayIdx();cw=ti<0?0:ti>55?7:Math.floor(ti/7);render();const tc=$('todaycard');if(tc)tc.scrollIntoView({behavior:'smooth',block:'center'});}
else if(b.dataset.all||b.dataset.clr){const p=(b.dataset.all||b.dataset.clr).split('-'),si=+p[0],ti=+p[1];SUB[si].t[ti][1].forEach((_,k)=>{const id='s'+si+'t'+ti+'u'+k;if(b.dataset.all)S.topics[id]=true;else delete S.topics[id];});save();syncTopic(si,ti);}
else if(b.dataset.ask){const p='Teach me "'+b.dataset.ask+'" ('+b.dataset.sub+') for SSC CGL, RRB NTPC and bank exams: key concepts, shortcuts, and 5 practice questions with solutions.';copyText(p).then(()=>flash('Prompt copied. Paste it into Claude.')).catch(()=>window.prompt('Copy this prompt:',p));}
else if(b.id==='mf-add'){saveMock();}
else if(b.dataset.del){if(confirm('Delete this test entry?')){S.mocks=S.mocks.filter(m=>m.id!==+b.dataset.del);save();$('mk-list').innerHTML=mockList();flash('Test deleted.');}}});

$('exp').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='study_planner_backup_'+iso(today0())+'.json';document.body.appendChild(a);a.click();a.remove();flash('Backup downloaded.');});
$('imp').addEventListener('click',()=>$('impfile').click());
$('impfile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
r.onload=()=>{try{const p=JSON.parse(r.result);if(typeof p!=='object'||!(p.done||p.topics||p.mocks))throw 0;S.start=p.start||S.start;S.done=p.done||{};S.topics=p.topics||{};S.mocks=Array.isArray(p.mocks)?p.mocks:[];save();render();flash('Backup restored.');}catch(err){alert('That file is not a planner backup.');}e.target.value='';};r.readAsText(f);});
$('rst').addEventListener('click',()=>{if(confirm('Clear all daily plan and topic ticks? Your logged mock tests are kept.')){S.done={};S.topics={};save();render();flash('Ticks cleared.');}});

$('store').textContent=persist?'Your ticks and test scores save automatically in this browser. Use "Back up progress" every week.':'This browser is blocking storage for local files, so data resets when the tab closes. Use "Back up progress" to keep it.';
const ti0=todayIdx();cw=ti0<0?0:ti0>55?7:Math.floor(ti0/7);render();
</script>
</body>
</html>
