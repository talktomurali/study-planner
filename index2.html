<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Govt exam study planner</title>
<style>
:root{--bg:#f7f6f2;--card:#ffffff;--soft:#efede6;--text:#1f1e1d;--muted:#5f5e5a;--faint:#888780;--border:rgba(0,0,0,.13);--accent:#185FA5;--accent-bg:#E6F1FB;--accent-border:#378ADD;--ok:#3B6D11;--danger:#A32D2D;--danger-bg:#FCEBEB}
@media (prefers-color-scheme:dark){:root{--bg:#1c1b1a;--card:#262524;--soft:#2e2d2b;--text:#eceae4;--muted:#b4b2a9;--faint:#888780;--border:rgba(255,255,255,.15);--accent:#B5D4F4;--accent-bg:#0C447C;--accent-border:#378ADD;--ok:#97C459;--danger:#F09595;--danger-bg:#501313}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.6}
.wrap{max-width:820px;margin:0 auto;padding:28px 18px 60px}
h1{font-size:24px;font-weight:600;margin:0 0 4px}
h3{font-size:17px;font-weight:600;margin:0 0 6px}
.sub{color:var(--muted);font-size:14px;margin:0 0 20px}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.metric{background:var(--soft);border-radius:10px;padding:14px 16px}
.metric .l{font-size:13px;color:var(--muted)}
.metric .v{font-size:21px;font-weight:600}
.bar,.mini{background:var(--soft);border-radius:4px;overflow:hidden}
.bar{height:6px;margin:-6px 0 18px}
.mini{height:5px;margin:6px 0 10px}
.bar div,.mini div{height:100%;background:var(--accent-border);width:0}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.wk{gap:6px;margin-bottom:10px}
.wk button{min-width:40px;padding:5px 8px}
.wkl{font-size:13px;color:var(--muted);margin-bottom:4px}
button{font:inherit;font-size:14px;color:var(--text);background:transparent;border:1px solid var(--border);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{background:var(--soft)}
button.on{background:var(--accent-bg);color:var(--accent);border-color:var(--accent-border)}
input[type=date],input[type=number],input[type=text],select,textarea{font:inherit;font-size:14px;color:var(--text);background:var(--card);border:1px solid var(--border);border-radius:8px;padding:5px 8px}
textarea{width:100%;min-height:60px;resize:vertical}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 18px;margin-bottom:12px}
.card.today{border:2px solid var(--accent-border)}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:4px;flex-wrap:wrap}
.head b{font-size:15px}
.row{display:flex;gap:10px;align-items:flex-start;padding:5px 0;font-size:14px;cursor:pointer}
.row input{margin-top:4px;flex-shrink:0;width:16px;height:16px}
.done{color:var(--faint);text-decoration:line-through}
.muted{font-size:13px;color:var(--muted)}
details{border-top:1px solid var(--border);padding:8px 0}
summary{cursor:pointer;font-size:15px}
.ctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.fld label{display:block;font-size:13px;color:var(--muted);margin-bottom:2px}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:6px;background:var(--soft);margin:2px 4px 2px 0}
.chip.weak{background:var(--danger-bg);color:var(--danger)}
.err{color:var(--danger);font-size:13px}
.late{color:var(--danger)}
.foot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:24px;padding-top:16px;border-top:1px solid var(--border)}
.okmsg{color:var(--ok);font-size:13px}
.crow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:7px 0;border-top:1px solid var(--border);font-size:14px}
.crow .cname{flex:1 1 180px}
.cnote{display:block;font-size:12px;color:var(--muted);text-decoration:none}
.cnum{display:flex;gap:4px;align-items:center}
.cnum input[type=number]{width:62px}
.xbtn{padding:4px 10px}
.cadd{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.cadd input[type=text]{flex:1 1 180px}
.cadd input[type=number]{width:96px}
</style>
</head>
<body>
<div class="wrap">
<h1>Govt exam study planner</h1>
<p class="sub">SSC CGL · RRB NTPC · Bank exams — phase 1: Everest Impact course (weeks 1–12) · phase 2: mocks and weak areas (weeks 13–24)</p>
<div class="metrics">
<div class="metric"><div class="l">Plan tasks done</div><div class="v" id="m-tasks">0 / 504</div></div>
<div class="metric"><div class="l">Days fully complete</div><div class="v" id="m-days">0 / 168</div></div>
<div class="metric"><div class="l">Course videos</div><div class="v" id="m-course">0</div></div>
<div class="metric"><div class="l">Subtopics done</div><div class="v" id="m-topics">0</div></div>
<div class="metric"><div class="l">Today</div><div class="v" id="m-week">–</div></div>
</div>
<div class="bar"><div id="m-bar"></div></div>
<div class="tabs" id="views">
<button data-v="plan" class="on">Daily plan</button>
<button data-v="course">Everest Impact course</button>
<button data-v="topics">Topics checklist</button>
<button data-v="mocks">Mock tracker</button>
<button data-v="resources">Resources</button>
<button data-v="rules">Rules</button>
</div>
<div id="view"></div>
<div class="foot">
<button id="exp">Back up progress</button>
<button id="imp">Restore backup</button>
<button id="rst">Reset plan and topic ticks</button>
<input type="file" id="impfile" accept=".json,application/json" style="display:none">
<span id="msg" class="okmsg"></span>
</div>
<p class="muted" id="store"></p>
</div>
<script>

const W=[
{a:'Number system',ad:'10 videos',p:'Surds and indices, quadratic equations',pd:'5 videos, 5 quizzes',e:'Nouns, pronouns, adjectives, adverbs',ed:'8 videos + vocabulary videos 1–2',r:'Analogy and classification',g:'Ancient history (NCERT Class 6)',s:'Physics: motion, force, laws of motion'},

{a:'Mensuration (first half)',ad:'videos 1–11',p:'catch up on any pending pure maths videos and quizzes, then previous-year questions',pd:'',cu:1,e:'Spellings, sentence completion, rearrangement of sentences',ed:'11 videos + vocabulary videos 21–22',r:'Circular seating, floor and box puzzles (bank)',g:'Static GK: awards, books, sports, important days',s:'Biology: plants, environment and ecology'},
{a:'Mensuration (second half)',ad:'videos 12–22',p:'rewatch your weakest pure maths chapter before access ends, then previous-year questions',pd:'',cu:1,e:'Reading comprehension, cloze test',ed:'3 reading comprehension videos + all cloze test videos',r:'Input-output, data sufficiency and mixed revision',g:'Static GK: organisations and headquarters + GA revision',s:'Science revision: reread all one-page notes'},

{ph2:1,q:'Data interpretation',r:'Input-output and data sufficiency',e:'Bank English: word swap, connectors, column-based',g:'Static GK: awards, books, sports, important days',s:'Science previous-year questions: biology'},
{ph2:1,q:'Your three weakest quant chapters (see mock tracker)',r:'Your weakest reasoning type',e:'Your weakest English area',g:'Mixed GA previous-year questions',s:'Reread all science one-page notes'},
{ph2:1,q:'Mixed arithmetic previous-year questions',r:'Mixed puzzles under time',e:'Mixed English previous-year questions',g:'Current affairs: last month',s:'Computer: terms and shortcuts revision'},
{ph2:1,q:'Mixed pure maths previous-year questions',r:'Mixed timed sets',e:'Mixed timed sets',g:'Final GA revision: one-page notes',s:'Final science revision'}];
const NW=W.length,ND=NW*7,NT=ND*3,P1=12;

const TG=[['all','All three (rotate)'],['cgl','SSC CGL'],['ntpc','RRB NTPC'],['bank','Bank PO / Clerk']];
const EXN={cgl:'SSC CGL Tier 1 (60 min, timed)',ntpc:'RRB NTPC CBT 1 (90 min, timed)',bank:'bank prelims (60 min, 20-minute section timers)'};
function paperEx(w){return S.target!=='all'?S.target:(w<P1?['cgl','ntpc'][w%2]:['cgl','ntpc','bank'][w%3]);}
function mockEx(w){return S.target!=='all'?S.target:['cgl','ntpc','bank'][(w+1)%3];}
function paperFor(w){return 'Full previous-year paper: '+EXN[paperEx(w)]+' – log it in the mock tracker';}
function mockFor(w){return 'Full mock from your test series: '+EXN[mockEx(w)]+' – log it in the mock tracker';}

function tasks1(w,d){const x=W[w];
const sat=x.cu?'Pure maths (3 hrs): '+x.p:'Pure maths (3 hrs): Everest Impact – '+x.p+' – videos and quizzes, then previous-year questions';
return [
['Maths (1 hr): Everest Impact – '+x.a+' – watch the next videos and solve each example yourself','English (1 hr): Everest Impact – '+x.e+' – next videos + notes','Reasoning (1 hr): '+x.r+' – learn the method, solve 20 questions'],
['Maths (1 hr): '+x.a+' – next videos + their quizzes','GA (1 hr): '+x.g,'Current affairs (30 min) + revise yesterday (30 min)'],
['Maths (1 hr): '+x.a+' – next videos + practice questions','English (1 hr): '+x.e+' – next videos + practice questions','Reasoning (1 hr): '+x.r+' – previous-year questions'],
['Maths (1 hr): '+x.a+' – finish this week\'s videos and quizzes','English (1 hr): '+x.e+' – next videos + 10 new words','Current affairs (30 min) + revise this week\'s notes (30 min)'],
['Maths (1 hr): '+x.a+' – timed set of previous-year questions','English (1 hr): finish this week\'s English videos, then read one editorial','Science (1 hr): '+x.s+' (NCERT Science)'],
[sat,'Reasoning (2 hrs): mixed practice of all topics so far','Static GA (2 hrs): finish '+x.g+' + notes'],
[paperFor(w),'Analyse the paper and update your mistakes notebook (1–1.5 hrs)','Course catch-up (2 hrs): watch any Everest Impact videos you missed this week, then revise your notes and formula sheets']][d];}

function tasks2(w,d){const x=W[w];return [
['Quant (1 hr): '+x.q+' – reread your formula sheet, then previous-year questions','Reasoning (1 hr): '+x.r+' – previous-year questions','GA (1 hr): '+x.g],
['Sectional test: Quant (timed) + analysis (1 hr) – log it in the mock tracker','English (1 hr): '+x.e,'Current affairs (30 min) + revise yesterday (30 min)'],

[mockFor(w),'Analyse the mock and update your mistakes notebook (2–3 hrs)','GA (2 hrs): '+x.g+' + static GK revision'],
[paperFor(w),'Analyse the paper and update your mistakes notebook (1–1.5 hrs)','Weekly review (1 hr): clear the revision list, check section averages in the mock tracker, pick next week\'s weak areas']][d];}

{k:'en',n:'English',a:'Monday, Wednesday, Thursday and Friday English slots follow this list. Vocabulary runs alongside at two videos a week.'},
{k:'ar',n:'Maths – arithmetic',a:'Monday to Friday maths slots follow this list, in this order.'},
{k:'pm',n:'Maths – pure maths',a:'Saturday\'s 3-hour block follows this list. Mensuration moves to the weekday slots in weeks 11–12.'}];
const CDEF={
en:[['Nouns',2],['Pronouns',2],['Adjectives',2],['Adverbs',2],['Articles',4],['Conjunctions',2],['Concord',2],['Tenses',15],['Question tags',2],['Prepositions',7,0,'Also has 1 PDF file – save it if the course allows downloads'],['Phrasal verbs',6],['Non-finites',3],['Voice',6],['Inversion and superfluous',2],['Speech',5],['Homonyms (grammar section)',1],['Homophones',2],['One-word substitutes',10],['Idioms',9],['Homonyms (vocabulary section)',2],['Spellings',4],['Sentence completion',3],['Rearrangement of sentences',4],['Reading comprehension',3],['Cloze test','',0,NOCNT],['Vocabulary',22,0,'Two videos a week alongside grammar, weeks 1–11']],

function defCourse(){const a=[];let i=0;CP.forEach(p=>CDEF[p.k].forEach(r=>a.push({id:'c'+(i++),p:p.k,n:r[0],tot:r[1]||'',w:0,qt:r[2]||0,qd:0,nt:r[3]||''})));return a;}
function cleanCourse(a){return a.filter(c=>c&&c.id!=null&&CDEF[c.p]&&c.n).map(c=>{const qt=+c.qt>0?Math.floor(+c.qt):0;return {id:String(c.id),p:c.p,n:String(c.n).slice(0,80),tot:+c.tot>0?Math.floor(+c.tot):'',w:Math.max(0,Math.floor(+c.w||0)),qt:qt,qd:Math.min(qt,Math.max(0,Math.floor(+c.qd||0))),nt:String(c.nt||'').slice(0,120)};});}
function migrate(old){const a=defCourse();(old||[]).forEach(o=>{if(!o||!o.n||!(+o.w>0))return;const m=a.find(c=>c.n.toLowerCase()===String(o.n).toLowerCase());if(m)m.w=m.tot?Math.min(Math.floor(+o.w),m.tot):Math.floor(+o.w);});return a;}
function cleanRev(o){const r={};if(o&&typeof o==='object')Object.keys(o).forEach(k=>{const v=o[k];if(v&&/^\d{4}-\d{2}-\d{2}$/.test(v.d)&&+v.n>=0&&+v.n<=3)r[k]={d:v.d,n:Math.floor(+v.n)};});return r;}

let S={start:'',done:{},topics:{},mocks:[],course:null,cend:'',cv:2,rev:{},target:'all'},persist=false,view='plan',cw=0,mf='All';
try{const raw=localStorage.getItem(K);if(raw){const p=JSON.parse(raw);S.start=p.start||'';S.done=p.done||{};S.topics=p.topics||{};S.mocks=Array.isArray(p.mocks)?p.mocks:[];S.cend=p.cend||'';S.rev=cleanRev(p.rev);S.target=TG.some(t=>t[0]===p.target)?p.target:'all';if(Array.isArray(p.course))S.course=p.cv===2?cleanCourse(p.course):migrate(p.course);}localStorage.setItem(K+'.t','1');persist=true;}catch(e){}

function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parse(s){const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function monday(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
function today0(){const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate());}
if(!Array.isArray(S.course))S.course=defCourse();
S.cv=2;
if(!S.cend){const t=today0();t.setMonth(t.getMonth()+3);S.cend=iso(t);}
if(!S.start){const t=today0();t.setDate(t.getDate()+(8-t.getDay())%7);S.start=iso(t);}
revSync();
save();
function todayIdx(){return Math.round((today0()-parse(S.start))/864e5);}
function fmt(i){const d=parse(S.start);d.setDate(d.getDate()+i);return d.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});}
function fmtD(s){return parse(s).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function rn(n){return Math.round(n*100)/100;}
function flash(t){const m=document.getElementById('msg');m.textContent=t;clearTimeout(flash.h);flash.h=setTimeout(()=>m.textContent='',3500);}
const $=id=>document.getElementById(id);

function topicCounts(si,ti){const u=SUB[si].t[ti][1];let c=0;u.forEach((_,k)=>{if(S.topics['s'+si+'t'+ti+'u'+k])c++;});return [c,u.length];}
function subjCounts(si){let c=0,n=0;SUB[si].t.forEach((_,ti)=>{const r=topicCounts(si,ti);c+=r[0];n+=r[1];});return [c,n];}
function allTopicCounts(){let c=0,n=0;SUB.forEach((_,si)=>{const r=subjCounts(si);c+=r[0];n+=r[1];});return [c,n];}

function ci(id){return S.course.find(c=>c.id===id);}
function cDone(c){const tot=+c.tot||0;return tot>0&&c.w>=tot&&(!c.qt||c.qd>=c.qt);}
function cCounts(k){let w=0,wk=0,t=0,ch=0,cd=0,qd=0,qt=0,miss=0;S.course.forEach(c=>{if(k&&c.p!==k)return;ch++;const tot=+c.tot||0;if(tot){t+=tot;const x=Math.min(c.w,tot);wk+=x;w+=x;}else{miss++;w+=c.w;}if(cDone(c))cd++;qt+=c.qt||0;qd+=Math.min(c.qd||0,c.qt||0);});return {w:w,wk:wk,t:t,ch:ch,cd:cd,qd:qd,qt:qt,miss:miss};}
function cLabel(c){const a=[];a.push(c.t?c.wk+' / '+c.t+' videos ('+Math.round(c.wk/c.t*100)+'%)':c.w+' videos watched');if(c.miss)a.push(c.miss+' chapter'+(c.miss>1?'s':'')+' without a video count');if(c.qt)a.push(c.qd+' / '+c.qt+' quizzes');a.push(c.cd+' / '+c.ch+' chapters done');return a.join(' · ');}
function cBar(c){return c.t?Math.round(c.wk/c.t*100):0;}
function accessDays(){return Math.round((parse(S.cend)-today0())/864e5);}
function paceText(){const c=cCounts(),left=Math.max(0,c.t-c.wk),ql=Math.max(0,c.qt-c.qd),days=accessDays();
if(days<0)return 'Course access ended on '+fmtD(S.cend)+'. If it was extended, change the date in the course tab.';
if(!left&&!ql&&!c.miss)return 'All videos and quizzes done. Use the remaining '+days+' days of access to rewatch your weakest chapters.';
const d=Math.max(1,days);
return left+' videos and '+ql+' quizzes left'+(c.miss?', plus '+c.miss+' chapter'+(c.miss>1?'s':'')+' with no video count yet':'')+' · '+days+' day'+(days===1?'':'s')+' of access left (until '+fmtD(S.cend)+') · watch about '+(left/d).toFixed(1)+' videos a day to finish in time.';}

function revSync(){const today=iso(today0());let added=0;const live={};
S.course.forEach(c=>{const k='c:'+c.id;live[k]=1;if(cDone(c)){if(!S.rev[k]){S.rev[k]={d:today,n:0};added++;}}else if(S.rev[k]&&!S.rev[k].n)delete S.rev[k];});
REVSUB.forEach(si=>SUB[si].t.forEach((_,ti)=>{const k='t:'+si+'-'+ti;live[k]=1;const tc=topicCounts(si,ti);if(tc[0]===tc[1]){if(!S.rev[k]){S.rev[k]={d:today,n:0};added++;}}else if(S.rev[k]&&!S.rev[k].n)delete S.rev[k];}));
Object.keys(S.rev).forEach(k=>{if(!live[k])delete S.rev[k];});return added;}
function revName(k){if(k.indexOf('c:')===0){const c=ci(k.slice(2));if(!c)return '';const p=CP.find(x=>x.k===c.p);return (p?p.n+': ':'')+c.n;}
const q=k.slice(2).split('-').map(Number);return SUB[q[0]]&&SUB[q[0]].t[q[1]]?SUB[q[0]].n+': '+SUB[q[0]].t[q[1]][0]:'';}
function rRev(){const T=today0(),due=[],soon=[];
Object.keys(S.rev).forEach(k=>{const r=S.rev[k];if(r.n>=3)return;const d=parse(r.d);d.setDate(d.getDate()+GAPS[r.n]);const diff=Math.round((d-T)/864e5);const it={k:k,n:r.n,diff:diff,name:revName(k)};if(!it.name)return;if(diff<=0)due.push(it);else if(diff<=7)soon.push(it);});
due.sort((a,b)=>a.diff-b.diff);soon.sort((a,b)=>a.diff-b.diff);
let h='<div class="card"><div class="head"><b>Revision due today</b><span class="muted">'+due.length+' due · '+soon.length+' in the next 7 days</span></div>';
if(!due.length)h+='<p class="muted" style="margin:0">Nothing due. When you finish an Everest Impact chapter, or tick off a whole reasoning, GA or computer topic, it appears here the next day, after a week and after a month.</p>';
else h+='<p class="muted" style="margin:0 0 4px">For each one: reread your notes or formula sheet, then solve 10 previous-year questions.</p>'+due.map(it=>'<div class="crow"><span class="cname">'+esc(it.name)+'<span class="cnote">'+RLBL[it.n]+(it.diff<0?' · <span class="late">'+(-it.diff)+' day'+(it.diff<-1?'s':'')+' overdue</span>':'')+'</span></span><button data-rv="'+esc(it.k)+'">Done</button></div>').join('');
if(soon.length)h+='<details style="margin-top:8px"><summary class="muted">Coming up</summary>'+soon.map(it=>'<div class="muted">'+esc(it.name)+' – '+RLBL[it.n].split(' – ')[0].toLowerCase()+' in '+it.diff+' day'+(it.diff>1?'s':'')+'</div>').join('')+'</details>';
return h+'</div>';}

function metrics(){let n=0,days=0;for(let w=0;w<NW;w++)for(let d=0;d<7;d++){let c=0;for(let t=0;t<3;t++)if(S.done['w'+w+'d'+d+'t'+t])c++;n+=c;if(c===3)days++;}
$('m-tasks').textContent=n+' / '+NT;$('m-days').textContent=days+' / '+ND;$('m-bar').style.width=Math.round(n/NT*100)+'%';
const tc=allTopicCounts();$('m-topics').textContent=tc[0]+' / '+tc[1];
const cc=cCounts();$('m-course').textContent=cc.t?cc.wk+' / '+cc.t:String(cc.w);
const ti=todayIdx();$('m-week').textContent=ti<0?'Starts '+fmt(0):ti>ND-1?'Plan complete':'Week '+(Math.floor(ti/7)+1)+', day '+(ti+1);}

function rPlan(){const ti=todayIdx();
let h='<div class="ctl"><label class="muted" for="st">Start date (a Monday)</label><input type="date" id="st" value="'+S.start+'"><button id="tdy">Go to today</button><label class="muted" for="tgt">Target exam</label><select id="tgt">'+TG.map(t=>'<option value="'+t[0]+'"'+(t[0]===S.target?' selected':'')+'>'+t[1]+'</option>').join('')+'</select></div>';
if(accessDays()>=0)h+='<p class="muted" style="margin:0 0 12px">Everest Impact: '+paceText()+'</p>';
h+=rRev();
const btn=i=>'<button data-w="'+i+'" class="'+(i===cw?'on':'')+'" aria-label="Week '+(i+1)+'">'+(i+1)+'</button>';
let b1='',b2='';for(let i=0;i<NW;i++){if(i<P1)b1+=btn(i);else b2+=btn(i);}
h+='<div class="wkl">Phase 1 – Everest Impact course (weeks)</div><div class="tabs wk">'+b1+'</div><div class="wkl">Phase 2 – mocks and weak areas (weeks)</div><div class="tabs wk">'+b2+'</div>';
const x=W[cw];
if(x.ph2)h+='<div class="card"><b>Week '+(cw+1)+' – phase 2 focus</b><div style="font-size:14px;margin-top:4px">Quant: '+x.q+'<br>Reasoning: '+x.r+'<br>English: '+x.e+'<br>GA: '+x.g+'<br>Science or computer: '+x.s+'</div><div class="muted" style="margin-top:6px">Saturday mock: '+EXN[mockEx(cw)]+' · Sunday paper: '+EXN[paperEx(cw)]+'</div></div>';
else h+='<div class="card"><b>Week '+(cw+1)+' – Everest Impact videos</b><div style="font-size:14px;margin-top:4px">Maths (weekdays): '+x.a+' ('+x.ad+')<br>Pure maths (Saturday): '+x.p+(x.pd?' ('+x.pd+')':'')+'<br>English: '+x.e+' ('+x.ed+')</div><div class="muted" style="margin-top:6px">Also this week – Reasoning: '+x.r+' · GA: '+x.g+' · Science: '+x.s+'</div></div>';
for(let d=0;d<7;d++){const idx=cw*7+d,ts=tasks(cw,d);let c=0,rows='';
ts.forEach((t,k)=>{const id='w'+cw+'d'+d+'t'+k,on=!!S.done[id];if(on)c++;rows+='<label class="row"><input type="checkbox" data-t="'+id+'"'+(on?' checked':'')+'><span class="'+(on?'done':'')+'">'+esc(t)+'</span></label>';});
const isT=idx===ti;h+='<div class="card'+(isT?' today':'')+'"'+(isT?' id="todaycard"':'')+'><div class="head"><b>Day '+(idx+1)+' · '+fmt(idx)+(isT?' · today':'')+'</b><span class="muted">'+c+'/3</span></div>'+rows+'</div>';}
return h;}

function cRow(c){let h='<div class="crow"><span class="cname'+(cDone(c)?' done':'')+'" id="cn-'+c.id+'">'+esc(c.n)+(c.nt?'<span class="cnote">'+esc(c.nt)+'</span>':'')+'</span>'+
'<span class="cnum"><span class="muted">Videos</span><input type="number" min="0" step="1" data-cw="'+c.id+'" value="'+c.w+'" aria-label="Videos watched: '+esc(c.n)+'"><span class="muted">/</span><input type="number" min="0" step="1" data-ct="'+c.id+'" value="'+c.tot+'" placeholder="?" aria-label="Total videos: '+esc(c.n)+'"></span>'+
'<button data-ci="'+c.id+'" title="Watched one more video">+1</button>';
if(c.qt)h+='<span class="cnum"><span class="muted">Quizzes</span><input type="number" min="0" step="1" data-qd="'+c.id+'" value="'+c.qd+'" aria-label="Quizzes done: '+esc(c.n)+'"><span class="muted">/ '+c.qt+'</span></span><button data-qi="'+c.id+'" title="Did one more quiz">+1</button>';
return h+'<button class="xbtn" data-cd="'+c.id+'" title="Remove chapter" aria-label="Remove '+esc(c.n)+'">×</button></div>';}

function rCourse(){let h='<div class="card"><h3>Course access</h3><div class="ctl" style="margin:6px 0"><label class="muted" for="cend">Access ends on</label><input type="date" id="cend" value="'+S.cend+'"></div><p style="margin:0;font-size:14px" id="pace">'+paceText()+'</p></div>';
h+='<p class="muted" style="margin:0 0 12px">These lists match your Everest Impact course: 293 videos and 42 quizzes, plus three chapters whose video counts you still need to fill in. Press +1 after every video or quiz. If a count is wrong, type the right number in the box. A finished chapter goes on the revision list in the daily plan.</p>';
h+=CP.map(p=>{const c=cCounts(p.k);
return '<div class="card"><div class="head"><h3 style="margin:0">'+p.n+'</h3><span class="muted" id="cp-'+p.k+'">'+cLabel(c)+'</span></div><div class="mini"><div id="cb-'+p.k+'" style="width:'+cBar(c)+'%"></div></div><p class="muted" style="margin:0 0 6px">'+p.a+'</p>'+
S.course.filter(x=>x.p===p.k).map(cRow).join('')+
'<div class="cadd"><input type="text" id="ca-'+p.k+'" maxlength="80" placeholder="New chapter name" aria-label="New chapter for '+p.n+'"><input type="number" min="0" id="cav-'+p.k+'" placeholder="videos" aria-label="Videos"><input type="number" min="0" id="caq-'+p.k+'" placeholder="quizzes" aria-label="Quizzes"><button data-ca="'+p.k+'">Add chapter</button></div></div>';}).join('');
return h+'<div><button id="c-reset">Restore default chapter list</button></div>';}

function syncCourse(k){const a=revSync();save();if(a)flash('Chapter complete – first revision is due tomorrow.');
const c=cCounts(k);const h=$('cp-'+k);if(h)h.textContent=cLabel(c);const b=$('cb-'+k);if(b)b.style.width=cBar(c)+'%';
S.course.filter(x=>x.p===k).forEach(x=>{const n=$('cn-'+x.id);if(n)n.className='cname'+(cDone(x)?' done':'');});
const pe=$('pace');if(pe)pe.textContent=paceText();metrics();}

function addChapter(k){const inp=$('ca-'+k);const n=inp?inp.value.trim():'';if(!n)return flash('Type a chapter name first.');
const v=Math.floor(+$('cav-'+k).value||0),q=Math.floor(+$('caq-'+k).value||0);
S.course.push({id:'c'+Date.now(),p:k,n:n.slice(0,80),tot:v>0?v:'',w:0,qt:q>0?q:0,qd:0,nt:''});save();render();const ni=$('ca-'+k);if(ni)ni.focus();flash('Chapter added.');}

function rTopics(){return '<p class="muted" style="margin:0 0 12px">Tick each subtopic when you have learned it and solved its previous-year questions. A topic is struck off when all its subtopics are done.</p>'+SUB.map((s,si)=>{const sc=subjCounts(si);
return '<div class="card"><div class="head"><h3 style="margin:0">'+s.n+'</h3><span class="muted" id="sc-'+si+'">'+sc[0]+' / '+sc[1]+' subtopics done</span></div><div class="mini"><div id="sb-'+si+'" style="width:'+Math.round(sc[0]/sc[1]*100)+'%"></div></div><p class="muted" style="margin:0 0 6px">'+s.a+'</p>'+
s.t.map((t,ti)=>{const tc=topicCounts(si,ti);
return '<details><summary><span id="tn-'+si+'-'+ti+'" class="'+(tc[0]===tc[1]?'done':'')+'">'+esc(t[0])+'</span> <span class="muted" id="tc-'+si+'-'+ti+'">'+tc[0]+'/'+tc[1]+'</span></summary><div style="padding:4px 0 4px 6px">'+
t[1].map((u,k)=>{const id='s'+si+'t'+ti+'u'+k,on=!!S.topics[id];return '<label class="row"><input type="checkbox" data-u="'+id+'" data-si="'+si+'" data-ti="'+ti+'"'+(on?' checked':'')+'><span class="'+(on?'done':'')+'">'+esc(u)+'</span></label>';}).join('')+
'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px"><button data-all="'+si+'-'+ti+'">Mark all done</button><button data-clr="'+si+'-'+ti+'">Clear</button><button data-ask="'+esc(t[0])+'" data-sub="'+esc(s.n)+'">Copy "teach me" prompt</button></div></div></details>';}).join('')+'</div>';}).join('');}

function syncTopic(si,ti){const a=revSync();save();if(a)flash('Topic complete – first revision is due tomorrow.');
const tc=topicCounts(si,ti);
const c=$('tc-'+si+'-'+ti);if(c)c.textContent=tc[0]+'/'+tc[1];
const nm=$('tn-'+si+'-'+ti);if(nm)nm.className=tc[0]===tc[1]?'done':'';
SUB[si].t[ti][1].forEach((_,k)=>{const id='s'+si+'t'+ti+'u'+k,cb=document.querySelector('[data-u="'+id+'"]');if(cb){cb.checked=!!S.topics[id];cb.nextElementSibling.className=S.topics[id]?'done':'';}});
const sc=subjCounts(si);const se=$('sc-'+si);if(se)se.textContent=sc[0]+' / '+sc[1]+' subtopics done';const sb=$('sb-'+si);if(sb)sb.style.width=Math.round(sc[0]/sc[1]*100)+'%';metrics();}

function pct(m){let s=0,x=0;SK.forEach(k=>{if(m.sc[k]){s+=m.sc[k].s;x+=m.sc[k].m;}});return x?s/x*100:0;}
function totals(m){let s=0,x=0;SK.forEach(k=>{if(m.sc[k]){s+=m.sc[k].s;x+=m.sc[k].m;}});return [rn(s),rn(x)];}
function fld(l,inner){return '<div class="fld"><label>'+l+'</label>'+inner+'</div>';}

function rMocks(){return '<div class="card"><h3>Log a test</h3><div class="grid4">'+
fld('Date','<input type="date" id="mf-date" value="'+iso(today0())+'" style="width:100%">')+
fld('Test type','<select id="mf-type" style="width:100%">'+TYPES.map(t=>'<option>'+t+'</option>').join('')+'</select>')+
fld('Test name or source','<input type="text" id="mf-name" placeholder="Everest Impact – Percentages quiz 5" style="width:100%">')+
'</div><p class="muted" style="margin:10px 0 4px">Enter net scores after negative marking. Leave both boxes blank for a section the test did not have (an Everest Impact maths quiz only needs Quant). Max marks fill in automatically for full mocks – change them if your test differs (IBPS PO prelims: quant 30, reasoning 40).</p><div class="grid4">'+
SK.map(k=>fld(SN[k],'<div style="display:flex;gap:6px;align-items:center"><input type="number" step="0.25" id="mf-'+k+'s" placeholder="score" style="width:50%"><span class="muted">/</span><input type="number" step="1" min="1" id="mf-'+k+'m" placeholder="max" style="width:50%"></div>')).join('')+
'</div><div class="grid4" style="margin-top:10px">'+
fld('Questions attempted (optional)','<input type="number" min="0" id="mf-att" style="width:100%">')+
fld('Questions wrong (optional)','<input type="number" min="0" id="mf-wr" style="width:100%">')+
fld('Time taken, minutes (optional)','<input type="number" min="0" id="mf-time" style="width:100%">')+
'</div><div class="fld" style="margin-top:10px"><label for="mf-notes">Weak topics and lessons from this test</label><textarea id="mf-notes" placeholder="Ran out of time in geometry; 3 careless errors in percentage"></textarea></div>'+
'<div style="display:flex;gap:12px;align-items:center;margin-top:10px;flex-wrap:wrap"><button id="mf-add" class="on">Save test</button><span id="mf-err" class="err"></span></div></div>'+
'<div class="ctl"><label class="muted" for="mf-filter">Show</label><select id="mf-filter">'+['All'].concat(TYPES).map(t=>'<option'+(t===mf?' selected':'')+'>'+t+'</option>').join('')+'</select></div><div id="mk-list">'+mockList()+'</div>';}

function setPreset(){const p=MP[$('mf-type').value]||{};SK.forEach(k=>{$('mf-'+k+'m').value=p[k]||'';});}

function chart(L,P){if(L.length<2)return '<div class="card"><p class="muted" style="margin:0">Log two or more tests to see your trend line.</p></div>';
const n=L.length,x0=44,x1=588,y0=168,y1=12,X=i=>x0+(x1-x0)*i/(n-1),Y=v=>y0-(y0-y1)*Math.max(0,Math.min(100,v))/100;
let s='<svg viewBox="0 0 600 200" width="100%" role="img" aria-label="Score trend in percent"><title>Score trend</title>';
[0,25,50,75,100].forEach(v=>{s+='<line x1="'+x0+'" x2="'+x1+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="currentColor" stroke-opacity="0.12"/><text x="'+(x0-6)+'" y="'+(Y(v)+4)+'" text-anchor="end" font-size="11" fill="currentColor" fill-opacity="0.6">'+v+'%</text>';});
s+='<polyline fill="none" stroke="#378ADD" stroke-width="2" points="'+P.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ')+'"/>';
P.forEach((v,i)=>{s+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="3.5" fill="#378ADD"><title>'+fmtD(L[i].date)+': '+v.toFixed(1)+'%</title></circle>';});
s+='<text x="'+x0+'" y="192" font-size="11" fill="currentColor" fill-opacity="0.6">'+fmtD(L[0].date)+'</text><text x="'+x1+'" y="192" text-anchor="end" font-size="11" fill="currentColor" fill-opacity="0.6">'+fmtD(L[n-1].date)+'</text></svg>';
return '<div class="card"><div class="muted" style="margin-bottom:4px">Total score trend (%)</div>'+s+'</div>';}

function mockList(){const L=S.mocks.filter(m=>mf==='All'||m.type===mf).slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.id-b.id);
if(!L.length)return '<p class="muted">No tests logged yet'+(mf==='All'?'':' for this type')+'. Save your first test above.</p>';
const P=L.map(pct),avg=P.reduce((a,b)=>a+b,0)/P.length,best=Math.max(...P);
const last=P.slice(-5),prev=P.slice(-10,-5),la=last.reduce((a,b)=>a+b,0)/last.length;
let delta='';if(prev.length){const pa=prev.reduce((a,b)=>a+b,0)/prev.length,d=la-pa;delta=' <span class="muted">('+(d>=0?'+':'')+d.toFixed(1)+' vs previous 5)</span>';}
let h='<div class="metrics"><div class="metric"><div class="l">Tests logged</div><div class="v">'+L.length+'</div></div><div class="metric"><div class="l">Average</div><div class="v">'+avg.toFixed(1)+'%</div></div><div class="metric"><div class="l">Best</div><div class="v">'+best.toFixed(1)+'%</div></div><div class="metric"><div class="l">Last 5 average</div><div class="v">'+la.toFixed(1)+'%'+delta+'</div></div></div>';
h+=chart(L,P);
const sa={};SK.forEach(k=>{const v=L.filter(m=>m.sc[k]).map(m=>m.sc[k].s/m.sc[k].m*100);if(v.length)sa[k]=v.reduce((a,b)=>a+b,0)/v.length;});
const ks=Object.keys(sa);if(ks.length){const weak=ks.reduce((a,b)=>sa[a]<=sa[b]?a:b);
h+='<div class="card"><div class="muted" style="margin-bottom:4px">Section averages'+(ks.length>1?' – focus on the red one':'')+'</div>'+ks.map(k=>'<span class="chip'+(ks.length>1&&k===weak?' weak':'')+'">'+SN[k]+': '+sa[k].toFixed(1)+'%</span>').join('')+'</div>';}
h+=L.slice().reverse().map(m=>{const t=totals(m),p=pct(m);
let acc='';if(m.att&&m.wr!=null&&m.wr!==''){acc='Accuracy '+((m.att-m.wr)/m.att*100).toFixed(1)+'% ('+m.wr+' wrong of '+m.att+')';}
const extra=[acc,m.time?m.time+' min':''].filter(Boolean).join(' · ');
return '<div class="card"><div class="head"><b>'+fmtD(m.date)+' · '+esc(m.type)+'</b><span><b>'+t[0]+' / '+t[1]+'</b> <span class="muted">('+p.toFixed(1)+'%)</span></span></div>'+
(m.name?'<div class="muted">'+esc(m.name)+'</div>':'')+
'<div style="margin:6px 0">'+SK.filter(k=>m.sc[k]).map(k=>'<span class="chip">'+SN[k]+' '+rn(m.sc[k].s)+'/'+m.sc[k].m+'</span>').join('')+'</div>'+
(extra?'<div class="muted">'+extra+'</div>':'')+
(m.notes?'<div style="font-size:14px;margin-top:6px;white-space:pre-wrap">'+esc(m.notes)+'</div>':'')+
'<div style="margin-top:8px"><button data-del="'+m.id+'">Delete</button></div></div>';}).join('');
return h;}

function saveMock(){const err=t=>{$('mf-err').textContent=t;};
const date=$('mf-date').value;if(!date)return err('Pick the test date.');
const sc={};let any=false;
for(const k of SK){const sv=$('mf-'+k+'s').value.trim(),mv=$('mf-'+k+'m').value.trim();
if(sv===''&&mv==='')continue;
if(sv===''||mv==='')return err('Enter both score and max for '+SN[k]+', or leave both blank.');
const s=+sv,m=+mv;if(!(m>0))return err('Max marks for '+SN[k]+' must be above 0.');
if(isNaN(s)||s>m||s<-m)return err(SN[k]+' score must be between -'+m+' and '+m+'.');
sc[k]={s:s,m:m};any=true;}
if(!any)return err('Enter at least one section score.');
const att=$('mf-att').value===''?null:+$('mf-att').value,wr=$('mf-wr').value===''?null:+$('mf-wr').value,tm=$('mf-time').value===''?null:+$('mf-time').value;
if(att!=null&&wr!=null&&wr>att)return err('Wrong answers cannot be more than questions attempted.');
S.mocks.push({id:Date.now(),date:date,type:$('mf-type').value,name:$('mf-name').value.trim(),sc:sc,att:att,wr:wr,time:tm,notes:$('mf-notes').value.trim()});
save();render();flash('Test saved.');}

function rRes(){return RES.map(g=>'<div class="card"><h3>'+g.n+'</h3>'+(g.note?'<p class="muted" style="margin:0 0 8px">'+g.note+'</p>':'')+g.i.map(x=>'<div style="padding:8px 0;border-top:1px solid var(--border)">'+(x[2]?'<a href="'+x[2]+'" target="_blank" rel="noopener" style="color:var(--accent);font-weight:600;text-decoration:none">'+esc(x[0])+' ↗</a>':'<b>'+esc(x[0])+'</b>')+'<div class="muted">'+esc(x[1])+'</div></div>').join('')+'</div>').join('');}
function rRules(){return '<div class="card">'+RULES.map((r,i)=>'<div class="row" style="cursor:default"><b style="min-width:22px">'+(i+1)+'.</b><span>'+esc(r)+'</span></div>').join('')+'</div>';}

function render(){const R={plan:rPlan,course:rCourse,topics:rTopics,mocks:rMocks,resources:rRes,rules:rRules};$('view').innerHTML=R[view]();if(view==='mocks')setPreset();metrics();}

function copyText(t){if(navigator.clipboard&&window.isSecureContext){return navigator.clipboard.writeText(t);}
return new Promise((res,rej)=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')?res():rej();}catch(e){rej(e);}a.remove();});}

document.querySelectorAll('#views [data-v]').forEach(b=>b.addEventListener('click',()=>{view=b.dataset.v;document.querySelectorAll('#views [data-v]').forEach(o=>o.classList.toggle('on',o===b));render();}));
const V=$('view');
V.addEventListener('change',e=>{const t=e.target;
if(t.dataset.t){if(t.checked)S.done[t.dataset.t]=true;else delete S.done[t.dataset.t];save();render();}
else if(t.dataset.u){if(t.checked)S.topics[t.dataset.u]=true;else delete S.topics[t.dataset.u];save();syncTopic(+t.dataset.si,+t.dataset.ti);}
else if(t.dataset.cw){const c=ci(t.dataset.cw);if(!c)return;let v=Math.max(0,Math.floor(+t.value||0));const tot=+c.tot||0;if(tot&&v>tot)v=tot;c.w=v;t.value=v;save();syncCourse(c.p);}
else if(t.dataset.ct){const c=ci(t.dataset.ct);if(!c)return;const v=Math.max(0,Math.floor(+t.value||0));c.tot=v>0?v:'';t.value=c.tot;
if(c.tot&&c.w>c.tot){c.w=c.tot;const wi=document.querySelector('[data-cw="'+c.id+'"]');if(wi)wi.value=c.w;}save();syncCourse(c.p);}
else if(t.dataset.qd){const c=ci(t.dataset.qd);if(!c)return;let v=Math.max(0,Math.floor(+t.value||0));if(v>c.qt)v=c.qt;c.qd=v;t.value=v;save();syncCourse(c.p);}
else if(t.id==='cend'&&t.value){S.cend=t.value;save();render();}
else if(t.id==='tgt'){S.target=t.value;save();render();flash('Target exam updated.');}
else if(t.id==='st'&&t.value){S.start=iso(monday(parse(t.value)));save();render();}
else if(t.id==='mf-type'){setPreset();}
else if(t.id==='mf-filter'){mf=t.value;$('mk-list').innerHTML=mockList();}});
V.addEventListener('input',e=>{if(e.target.id&&e.target.id.indexOf('mf-')===0){const er=$('mf-err');if(er)er.textContent='';}});
V.addEventListener('keydown',e=>{const t=e.target;if(e.key==='Enter'&&t.id&&/^ca[vq]?-/.test(t.id)){e.preventDefault();addChapter(t.id.split('-')[1]);}});
V.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
if(b.dataset.w!==undefined){cw=+b.dataset.w;render();}
else if(b.id==='tdy'){const ti=todayIdx();cw=ti<0?0:ti>ND-1?NW-1:Math.floor(ti/7);render();const tc=$('todaycard');if(tc)tc.scrollIntoView({behavior:'smooth',block:'center'});}
else if(b.dataset.rv){const r=S.rev[b.dataset.rv];if(r&&r.n<3){r.n++;r.d=iso(today0());save();render();flash(r.n>=3?'All three revisions done for this one.':'Revision logged.');}}
else if(b.dataset.ci){const c=ci(b.dataset.ci);if(!c)return;const tot=+c.tot||0;if(tot&&c.w>=tot)return flash('All videos in this chapter are already watched.');c.w++;const wi=document.querySelector('[data-cw="'+c.id+'"]');if(wi)wi.value=c.w;save();syncCourse(c.p);}
else if(b.dataset.qi){const c=ci(b.dataset.qi);if(!c)return;if(c.qd>=c.qt)return flash('All quizzes in this chapter are done.');c.qd++;const qi=document.querySelector('[data-qd="'+c.id+'"]');if(qi)qi.value=c.qd;save();syncCourse(c.p);}
else if(b.dataset.cd){const c=ci(b.dataset.cd);if(c&&confirm('Remove "'+c.n+'" from your course list?')){S.course=S.course.filter(x=>x.id!==c.id);revSync();save();render();flash('Chapter removed.');}}
else if(b.dataset.ca){addChapter(b.dataset.ca);}
else if(b.id==='c-reset'){if(confirm('Replace your chapter list with the default one? Video and quiz counts in this tab will be cleared.')){S.course=defCourse();revSync();save();render();flash('Default chapter list restored.');}}
else if(b.dataset.all||b.dataset.clr){const p=(b.dataset.all||b.dataset.clr).split('-'),si=+p[0],ti=+p[1];SUB[si].t[ti][1].forEach((_,k)=>{const id='s'+si+'t'+ti+'u'+k;if(b.dataset.all)S.topics[id]=true;else delete S.topics[id];});save();syncTopic(si,ti);}
else if(b.dataset.ask){const p='Teach me "'+b.dataset.ask+'" ('+b.dataset.sub+') for SSC CGL, RRB NTPC and bank exams: key concepts, shortcuts, and 5 practice questions with solutions.';copyText(p).then(()=>flash('Prompt copied. Paste it into Claude.')).catch(()=>window.prompt('Copy this prompt:',p));}
else if(b.id==='mf-add'){saveMock();}
else if(b.dataset.del){if(confirm('Delete this test entry?')){S.mocks=S.mocks.filter(m=>m.id!==+b.dataset.del);save();$('mk-list').innerHTML=mockList();flash('Test deleted.');}}});

$('exp').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='study_planner_backup_'+iso(today0())+'.json';document.body.appendChild(a);a.click();a.remove();flash('Backup downloaded.');});
$('imp').addEventListener('click',()=>$('impfile').click());
$('impfile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
r.onload=()=>{try{const p=JSON.parse(r.result);if(typeof p!=='object'||!p||!(p.done||p.topics||p.mocks||p.course))throw 0;S.start=p.start||S.start;S.done=p.done||{};S.topics=p.topics||{};S.mocks=Array.isArray(p.mocks)?p.mocks:[];if(Array.isArray(p.course))S.course=p.cv===2?cleanCourse(p.course):migrate(p.course);if(p.cend)S.cend=p.cend;S.rev=cleanRev(p.rev);if(TG.some(t=>t[0]===p.target))S.target=p.target;S.cv=2;revSync();save();render();flash('Backup restored.');}catch(err){alert('That file is not a planner backup.');}e.target.value='';};r.readAsText(f);});
$('rst').addEventListener('click',()=>{if(confirm('Clear all daily plan and topic ticks? Your logged mock tests, course progress and course revisions are kept.')){S.done={};S.topics={};revSync();save();render();flash('Ticks cleared.');}});

$('store').textContent=persist?'Your ticks, course progress, revisions and test scores save automatically in this browser on this device. Use "Back up progress" every week, and to move your data to another device.':'This browser is blocking storage, so data resets when the tab closes. Use "Back up progress" to keep it.';
const ti0=todayIdx();cw=ti0<0?0:ti0>ND-1?NW-1:Math.floor(ti0/7);render();
</script>
</body>
